- id: REQ-ARM-001
  title: Compatible joints before motion
  shall: >
    The arm shall not move any joint until every one of its six joints has reported a compatible motor protocol
    contract.

- id: REQ-ARM-002
  title: Coordinated joint move
  shall: >
    When commanded to a joint-space target within the joint limits, the arm shall move all six joints so that they
    start together and arrive together at the target.

- id: REQ-ARM-003
  title: Targets outside the joint limits
  shall: >
    The arm shall refuse a target outside any joint's position limits without moving any joint.

- id: REQ-ARM-004
  title: Stop on a joint fault
  shall: >
    When any joint reports a fault, the arm shall emergency-stop all six joints and refuse further motion until it
    is re-armed with no joint faulted.

- id: REQ-ARM-005
  title: Stop on a silent joint
  shall: >
    When any joint stops answering, the arm shall emergency-stop all six joints within the configured number of
    control periods.

- id: REQ-ARM-006
  title: Commands reach every joint
  shall: >
    The arm shall deliver each joint command to all six joints, even when it is issued while other traffic is
    waiting on the bus, or else report that the command was not delivered.

- id: REQ-ARM-007
  title: Joint-space positions and limits
  shall: >
    The arm shall take and report joint positions and speeds, and check position limits, in joint space, converting
    to and from each motor's shaft through that joint's gear ratio, direction and zero offset.

- id: REQ-ARM-008
  title: Start-up order
  shall: >
    The arm shall move only after every joint has reported a compatible contract, every joint has reported itself
    calibrated and every joint has been started in the configured control mode, and after a joint fault or a silent
    joint it shall move again only once it has been re-armed and brought back to that point.
