- id: REQ-ARM-001
  title: Compatible joints before motion
  shall: >
    The arm shall not move any joint until every one of its six joints has reported a compatible motor protocol
    contract.

- id: REQ-ARM-002
  title: Coordinated joint move
  shall: >
    When commanded to a joint-space target within the joint limits, the arm shall move all six joints so that they
    start together and arrive together at the target.

- id: REQ-ARM-003
  title: Targets outside the joint limits
  shall: >
    The arm shall refuse a target outside any joint's position limits without moving any joint.

- id: REQ-ARM-004
  title: Stop on a joint fault
  shall: >
    When any joint reports a fault, the arm shall emergency-stop all six joints and refuse further motion until it
    is re-armed with no joint faulted.

- id: REQ-ARM-005
  title: Stop on a silent joint
  shall: >
    When any joint stops answering, the arm shall emergency-stop all six joints within the configured number of
    control periods.

- id: REQ-ARM-006
  title: Commands reach every joint
  shall: >
    The arm shall deliver each joint command to all six joints, even when it is issued while other traffic is
    waiting on the bus, or else report that the command was not delivered.

- id: REQ-ARM-007
  title: Joint-space positions and limits
  shall: >
    The arm shall take and report joint positions and speeds, and check position limits, in joint space, converting
    to and from each motor's shaft through that joint's gear ratio, direction and zero offset.

- id: REQ-ARM-008
  title: Start-up order
  shall: >
    The arm shall move only after every joint has reported a compatible contract, every joint has reported itself
    calibrated and every joint has been started in the configured control mode, and after a joint fault or a silent
    joint it shall move again only once it has been re-armed and brought back to that point.

- id: REQ-ARM-009
  title: Joint motor-controller configuration
  shall: >
    The arm shall apply a joint's motor-controller algorithms and gains only while every joint is calibrated and no
    joint is running, and shall read them back from the joint so that what was applied can be confirmed.

- id: REQ-ARM-010
  title: Arm profile
  shall: >
    The arm shall take its configuration, namely its control timing and per joint the node, gear ratio, direction,
    zero offset, limits and motor controller, from one profile file, shall refuse a profile with an unknown,
    missing or out-of-range item and name that item, and shall write its configuration to a profile that reads
    back to the same configuration.

- id: REQ-ARM-011
  title: Motor controllers applied at bring-up
  shall: >
    While bringing itself up, the arm shall apply each joint motor controller its configuration names and confirm
    it by reading it back before it can be enabled, and shall stop the bring-up and name the joint when one cannot
    be applied or reads back different.

- id: REQ-ARM-012
  title: Joint motor configuration
  shall: >
    The arm shall apply a joint's motor model and drive limits, from a reference motor or custom values, only while
    every joint is calibrated and no joint is running, shall read them back to confirm them, and while bringing
    itself up shall apply and confirm each motor its configuration names before that joint's motor controller.

- id: REQ-MOD-001
  title: Tool pose from the joint positions
  shall: >
    The arm shall report its tool pose, position and orientation in the base frame, from the measured joint
    positions once per control period, and name the singularity it is near.

- id: REQ-MOD-002
  title: Unreachable poses refused
  shall: >
    The arm shall convert a tool pose to joint positions within the joint limits, choosing the solution closest to
    the current joints, and shall refuse a pose it cannot reach or can reach only outside the joint limits, saying
    which.

- id: REQ-MOD-003
  title: Joint torques from the arm's mass
  shall: >
    The arm shall report the gravity torque of each joint at the measured joint positions once per control period,
    and shall convert a joint motion of positions, speeds and accelerations to joint torques, from its geometry, the
    mass properties of its links and its payload.
