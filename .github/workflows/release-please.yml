---
name: Create Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  release_please:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          app-id: ${{ vars.FOREST_RELEASER_APP_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}

  build_host:
    name: Build Host Package
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ github.job }}-ubuntu-latest
          max-size: 2G
          save: false
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "host"
          buildPreset: "host-Release-WithPackage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-install-package
          path: build/host/e_robot_arm-*.*
          if-no-files-found: error

  build_tools:
    name: Build Tools Installers
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-tools.yml
    with:
      version: ${{ needs.release_please.outputs.tag_name }}
    secrets: inherit

  build_embedded:
    name: Build Embedded (${{ matrix.target }})
    needs: [release_please, build_host]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      # The firmware applications a release publishes for each board, by ELF base name, separated by spaces.
      # None is defined yet (targets/README.md): the boards are built to keep them compiling, and nothing is
      # published. An ELF that is built but not listed here fails the release.
      FIRMWARE_APPLICATIONS: ""
    strategy:
      matrix:
        target: ["EK-TM4C1294XL", "EK-TM4C123GXL"]
        configuration: ["RelWithDebInfo"]
        gcc: ["13.2.Rel1"]
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install GNU Arm Embedded Toolchain ${{ matrix.gcc }}
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1.14.1
        with:
          release: ${{ matrix.gcc }}
      - run: sudo apt-get update && sudo apt-get install ninja-build xsltproc
      - uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ github.job }}-${{ matrix.target }}
          max-size: 2G
          save: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-install-package
      - run: tar -zxvf e_robot_arm-*.tar.gz
      - run: mkdir -p install && mv e_robot_arm-*/* install/ || true
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      - name: Package firmware
        id: package
        run: scripts/package-firmware.sh build "${{ matrix.target }}" "${{ matrix.configuration }}" "${{ needs.release_please.outputs.tag_name }}" "$FIRMWARE_APPLICATIONS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.package.outputs.packaged == 'true'
        with:
          name: firmware-${{ matrix.target }}
          path: e_robot_arm-firmware-${{ matrix.target }}-*.tar.gz
          if-no-files-found: error

  build_documentation:
    name: Build Documentation
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate documentation PDFs and traceability matrix
        uses: embedded-pro/project-documentation@ddd3e4db45b9c6d77c561a8edb197e5a568bae1a # v0.4.0
        with:
          run-build-documentation-pdfs: 'true'
          run-traceability-matrix: 'true'
          version: ${{ needs.release_please.outputs.tag_name }}
          name-prefix: e_robot_arm
          output-dir: docs-pdf
          artifact-name: documentation-pdfs
          requirements-dir: documentation/requirements
          features-dir: integration_tests/features
          matrix-output: docs-pdf/traceability-matrix.md
          matrix-pdf-output: docs-pdf/e_robot_arm-traceability-matrix-${{ needs.release_please.outputs.tag_name }}.pdf

  publish_release_assets:
    name: Publish Release Assets
    needs:
      [
        release_please,
        build_host,
        build_tools,
        build_embedded,
        build_documentation
      ]
    if: ${{ !cancelled() && needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Remove host install package
        run: rm -f release-assets/e_robot_arm-0*.* release-assets/e_robot_arm-*-Linux.*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.release_please.outputs.tag_name }}"
          for asset in release-assets/*; do
            [ -f "$asset" ] || continue
            echo "Uploading: $asset"
            gh release upload "$tag" "$asset" --repo "$GH_REPO"
          done
