---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  GTEST_COLOR: 1

jobs:
  host_build_test_ubuntu:
    name: Host Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-ubuntu-latest
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "host"
          buildPreset: "host-Debug-WithPackage"
          testPreset: "host"
      - name: Run SIL integration tests
        run: |
          sil_test=$(find build/host -name "embedded_scaffold.integration_tests" -type f -executable -print -quit)
          if [[ -z "$sil_test" ]]; then
            echo "::error::SIL integration test executable not found"
            exit 1
          fi
          $sil_test --format summary pretty junit:sil-test-report.xml -- integration_tests/features
      - name: Generate SIL test summary
        if: always()
        run: |
          if [[ ! -f sil-test-report.xml ]]; then
            {
              echo "## SIL Integration Test Results"
              echo ""
              echo "_Report not generated — SIL test step did not produce output._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## SIL Integration Test Results"
            echo ""
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('sil-test-report.xml')
          root = tree.getroot()
          suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
          features = {}
          for suite in suites:
              for tc in suite.findall('testcase'):
                  feature = tc.get('classname', 'Unknown')
                  name = tc.get('name', 'Unknown')
                  failed = tc.find('failure') is not None
                  skipped = tc.find('skipped') is not None
                  status = ':x:' if failed else ':zzz:' if skipped else ':white_check_mark:'
                  features.setdefault(feature, []).append((name, status))
          for feature, scenarios in features.items():
              print(f'### {feature}')
              print('| Scenario | Status |')
              print('|---|---|')
              for name, status in scenarios:
                  print(f'| {name} | {status} |')
              print()
          "
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          check_name: SIL Integration Test Results
          comment_title: SIL Integration Test Results
          files: sil-test-report.xml
          report_individual_runs: true
          report_suite_logs: info
          comment_mode: off
      - name: Upload SIL test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sil-test-report
          path: sil-test-report.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded_scaffold
          path: build/host/embedded_scaffold-*-Linux.tar.gz
          if-no-files-found: error
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: build/host/Testing/Temporary/
  host_cross_windows:
    name: Host Cross-Compile (Linux → Windows)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ github.job }}-windows-cross-${{ github.sha }}
          restore-keys: ${{ github.job }}-windows-cross-
      - name: Cross-compile for Windows
        run: cmake --preset windows && cmake --build --preset windows-RelWithDebInfo
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded_scaffold-windows
          path: build/windows/**/*.exe
          if-no-files-found: warn
  embedded_build:
    name: Embedded Build
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    needs: [host_build_test_ubuntu, host_cross_windows]
    strategy:
      fail-fast: false
      matrix:
        configuration: ["RelWithDebInfo"]
        target:
          [
            "EK-TM4C1294XL",
            "EK-TM4C123GXL",
            "STM32F407G-DISC1",
            "NUCLEO-H563ZI"
          ]
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.configuration }}-${{ matrix.target }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded_scaffold
      - run: tar -zxvf embedded_scaffold-*.tar.gz
      - run: mkdir install && mv embedded_scaffold-*/* install/
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      # NOTE: cycle-budget and memory-budget analysis steps were removed with the
      # example firmware. Re-add embedded-pro/cortex-cycle-budget and
      # embedded-pro/cortex-memory-budget steps here once a real firmware target
      # (with an .elf and analysis config) replaces the example placeholders.
